services:
  frontend:
    build:
      context: storefront
      args:
        - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_test
        - MEDUSA_BACKEND_URL=http://localhost:9000
        - NODE_ENV=production
      network: host
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 1024M
    volumes:
      - storefront-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  storefront-data:
